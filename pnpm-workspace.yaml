packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

overrides:
  deepmerge-ts: 8.0.2
  fast-uri: 3.1.8
  js-yaml@3: 3.15.2
  nanoid@3: 3.3.20
  nodemailer@<=10.0.5: 10.0.15
  postcss: 8.5.29
  '@tiptap/core': 3.31.4
  '@tiptap/pm': 3.31.4
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  probe-image-size: 7.4.0
  prosemirror-view: 1.42.6
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  tinypool: 2.2.0
  undici@7: 7.30.0

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  # Hypermail does not use OS keychain storage; retain its encrypted file store.
  keytar: false
