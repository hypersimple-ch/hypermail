packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

overrides:
  deepmerge-ts: 8.0.0
  fast-uri: 3.1.5
  js-yaml@3: 3.15.1
  nanoid@3: 3.3.18
  nodemailer@<=9.0.0: 9.0.3
  postcss: 8.5.24

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  # Hypermail does not use OS keychain storage; retain its encrypted file store.
  keytar: false
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.24'
  - '@ai-sdk/google@4.0.28'
  - '@ai-sdk/openai@4.0.24'
  - '@ai-sdk/provider-utils@5.0.15'
# image-size 2.0.3 is named as patched but is not published; keep these narrow ignores until it is available.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
