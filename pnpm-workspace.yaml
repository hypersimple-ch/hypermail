packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

overrides:
  nodemailer@<=9.0.0: 9.0.3
  postcss: 8.5.24

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  # Hypermail does not use OS keychain storage; retain its encrypted file store.
  keytar: false
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.24'
  - '@ai-sdk/google@4.0.28'
  - '@ai-sdk/openai@4.0.24'
  - '@ai-sdk/provider-utils@5.0.15'
