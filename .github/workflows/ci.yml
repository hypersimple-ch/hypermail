name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - if: github.event_name == 'pull_request'
        run: pnpm security:scan

  security:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:scan
      - run: docker build -f infra/Dockerfile.web -t hypermail-web:scan .
      - run: docker build -f infra/Dockerfile.worker -t hypermail-worker:scan .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hypermail-web:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hypermail-worker:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
