name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - if: github.event_name == 'pull_request'
        run: pnpm security:scan

  security:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:scan

  container-security:
    if: github.event_name != 'pull_request'
    name: container-security (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: infra/Dockerfile.web
            image: hypermail-web:scan
          - service: worker
            dockerfile: infra/Dockerfile.worker
            image: hypermail-worker:scan
          - service: hypermail
            dockerfile: infra/Dockerfile.hypermail
            image: hypermail-runtime:scan
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }} .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
