services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mastra_proof
      POSTGRES_USER: mastra
      POSTGRES_PASSWORD: mastra
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastra -d mastra_proof"]
      interval: 2s
      timeout: 3s
      retries: 20
