name: hypermail-local

services:
  proxy:
    image: caddy:2.8-alpine
    ports:
      - "127.0.0.1:${LOCAL_HTTP_PORT:-8080}:80"
    volumes:
      - ./proxy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    user: "10001:10001"
    env_file: ["${WEB_ENV_FILE:-../.env}"]
    environment:
      ATTACHMENT_TEMP_DIRECTORY: /var/lib/hypermail-attachments
    volumes:
      - attachment-temp:/var/lib/hypermail-attachments
    depends_on:
      attachment-temp-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      hypermail:
        condition: service_healthy
    networks: [edge, private]

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      target: migrate
    env_file: ["${WEB_ENV_FILE:-../.env}"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    env_file: ["${WORKER_ENV_FILE:-../.env}"]
    environment:
      HEALTH_PORT: 3001
      CODEX_HOME: /var/lib/codex
    volumes:
      - codex-home:/var/lib/codex
      - type: bind
        source: "${CODEX_AUTH_FILE:-${HOME}/.codex/auth.json}"
        target: /run/codex-seed/auth.json
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      hypermail:
        condition: service_healthy
    networks: [private, egress]

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: hypermail
      POSTGRES_USER: hypermail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the local environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [private]

  attachment-temp-init:
    image: alpine:3.21
    user: "0:0"
    command: ["sh", "-c", "install -d -m 0700 -o 10001 -g 10001 /attachments"]
    volumes:
      - attachment-temp:/attachments

  hypermail:
    build:
      context: ..
      dockerfile: infra/Dockerfile.hypermail
    user: "10001:10001"
    environment:
      HYPERMAIL_KEY: ${HYPERMAIL_KEY:?set HYPERMAIL_KEY in .env}
      TMPDIR: /var/lib/hypermail-attachments
    volumes:
      - hypermail-data:/var/lib/hypermail
      - attachment-temp:/var/lib/hypermail-attachments
    depends_on:
      attachment-temp-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "node -e \"fetch('http://127.0.0.1:3000/mcp', {headers:{accept:'application/json, text/event-stream'}}).then(r => process.exit(r.status === 400 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private]

networks:
  edge: {}
  egress: {}
  private:
    internal: true

volumes:
  postgres-data: {}
  hypermail-data: {}
  attachment-temp: {}
  codex-home: {}
